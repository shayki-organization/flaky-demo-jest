name: Broken suite

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  broken-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run broken test
        run: npx jest --config '{"testMatch":["**/broken/*.test.js"]}'
